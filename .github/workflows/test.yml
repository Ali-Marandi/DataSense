name: Test DataSense

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy PyQt6 pytest

      - name: Run tests
        run: |
          # Use xvfb to run tests that might involve GUI components, 
          # although our unit tests currently only test the core logic.
          python -m unittest discover tests
