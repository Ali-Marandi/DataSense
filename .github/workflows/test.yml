name: Verify DataSense

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python regression and enterprise-control-plane tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            enterprise_control_plane/requirements.txt

      - name: Install Linux runtime libraries required by PyQt6 smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install application and Control Plane dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r enterprise_control_plane/requirements.txt

      - name: Run complete pytest suite
        run: python -m pytest -q

  validate-activation-governance:
    name: Validate activation-governance skill and safety guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate skill resources and non-production dry-run guard
        run: python3 enterprise_control_plane/scripts/validate_activation_governance_skill.py

  validate-kubernetes:
    name: Render and validate Kubernetes baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Render base and environment overlays
        run: |
          mkdir -p rendered-manifests
          for layer in base overlays/staging overlays/production; do
            output="rendered-manifests/$(echo "$layer" | tr '/' '-')".yaml
            kubectl kustomize "enterprise_control_plane/k8s/$layer" > "$output"
            test -s "$output"
          done

      - name: Validate source YAML and dashboard JSON without a cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint jq
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments-indentation: disable}}' .github/workflows enterprise_control_plane/k8s
          jq empty enterprise_control_plane/k8s/monitoring/grafana-dashboard.json
          # kubectl apply dry-run still needs an API server for discovery. Admission,
          # CRD schema and RBAC validation occur in the protected promotion workflow.

      - name: Publish rendered manifests for review
        uses: actions/upload-artifact@v4
        with:
          name: datasense-kubernetes-rendered-${{ github.sha }}
          retention-days: 14
          path: rendered-manifests/
