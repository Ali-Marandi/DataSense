name: Build & release Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            enterprise_control_plane/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r enterprise_control_plane/requirements.txt
          pip install pyinstaller==6.10.0 pytest

      - name: Run test suite
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean DataSense.spec

      - name: Package portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "dev" }
          Compress-Archive -Path dist/DataSense/* -DestinationPath "dist/DataSense-$version-windows-x64-portable.zip"
          Copy-Item dist/DataSense/DataSense.exe "dist/DataSense-$version-windows-x64.exe"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "1.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=$version installer/DataSense.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DataSense-windows
          path: |
            dist/*.zip
            dist/*.exe
            installer/output/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DataSense ${{ github.ref_name }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/DataSense-*-windows-x64.exe
            installer/output/*.exe
