[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datasense-desktop"
version = "0.1.0"
description = "Local-first, trusted analytics desktop boilerplate for Windows"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "pyarrow>=15,<26",
  "platformdirs>=4.0,<5.0",
  "PyQt6>=6.6,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
package = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
