<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Vazirmatn',sans-serif;background:#fff;color:#334155;
            display:flex;justify-content:center;align-items:flex-start;height:100vh;overflow:hidden;
        }
        .slide-container{
            width:1280px;min-height:720px;background:#fff;position:relative;
            display:grid;grid-template-columns:repeat(12,1fr);gap:8px;padding:8px;border:2px solid #0F172A;
            transform:translateY(-100px);
        }
        .slide-container::before{
            content:'';position:absolute;top:0;left:0;right:0;bottom:0;
            background-image:linear-gradient(to right,rgba(15,23,42,0.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(15,23,42,0.05) 1px,transparent 1px);
            background-size:calc((1280px - 32px) / 12) calc((720px - 32px) / 12);
            background-position:16px 16px;pointer-events:none;z-index:0;
        }
        .content-box{
            grid-column:2/12;grid-row:4/9;border:2px solid #0F172A;background:#fff;z-index:1;
            display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 32px 6px;position:relative;text-align:center;
        }
        .content-box::before,.content-box::after{content:'';position:absolute;width:32px;height:32px;border:6px solid #0284C7}
        .content-box::before{top:-4px;right:-4px;border-bottom:none;border-left:none}
        .content-box::after{bottom:-4px;left:-4px;border-top:none;border-right:none}
        h1{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:56px;color:#0F172A;margin-bottom:16px;line-height:1.3}
        h3{font-size:28px;font-weight:400;color:#334155;line-height:1.6;max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .code-inline{font-family:'JetBrains Mono',monospace;color:#0284C7;font-weight:600;direction:ltr;display:inline-block}
        .action-line{margin-top:12px;border-top:2px solid rgba(15,23,42,0.1);padding-top:10px;width:100%;font-family:'JetBrains Mono',monospace;color:#0284C7;font-size:20px;letter-spacing:2px;direction:ltr}
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-box">
            <h1>Alpha آمادهٔ ارزیابی کنترل‌شده است</h1>
            <h3>دریافت از <span class="code-inline">Release</span>، بررسی <span class="code-inline">SHA-256</span>، استفاده با دادهٔ غیرحساس و ثبت بازخورد</h3>
            <div class="action-line">DATASENSE NEXTGEN ALPHA v0.1.0</div>
        </div>
    </div>
</body>
</html>
