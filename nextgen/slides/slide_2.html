<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #FFFFFF;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            position: relative;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 16px;
            padding: 32px;
            border: 2px solid #0F172A;
        }
        
        /* Header Section */
        .header-box {
            grid-column: 1 / 13;
            grid-row: 1 / 3;
            border-bottom: 2px solid #0F172A;
            display: flex;
            align-items: flex-end;
            padding-bottom: 16px;
        }
        h2 {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 40px;
            color: #0F172A;
        }
        .header-accent {
            color: #0284C7;
            margin-left: 16px;
        }

        /* Content Section */
        .content-main {
            grid-column: 1 / 9;
            grid-row: 4 / 12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 32px;
        }
        
        .list-container {
            list-style: none;
        }
        .list-item {
            font-size: 28px;
            line-height: 1.6;
            margin-bottom: 32px;
            position: relative;
            padding-right: 32px;
            border-right: 2px solid #0284C7;
        }
        .list-item::before {
            content: '>';
            font-family: 'JetBrains Mono', monospace;
            color: #0284C7;
            position: absolute;
            right: 8px;
            top: 0;
            font-weight: 600;
        }
        
        /* Structural Side Graphic */
        .side-graphic {
            grid-column: 9 / 13;
            grid-row: 4 / 12;
            border-right: 2px solid #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .bracket-container {
            width: 100%;
            height: 60%;
            border: 4px solid #0F172A;
            border-left: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bracket-container::before {
            content: '01';
            font-family: 'JetBrains Mono', monospace;
            font-size: 120px;
            font-weight: 600;
            color: rgba(15, 23, 42, 0.1);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-box">
            <h2><span class="header-accent">#</span> مسئله: تحلیل سریع، بدون ترک دستگاه</h2>
        </div>
        
        <div class="content-main">
            <ul class="list-container">
                <li class="list-item">تیم‌ها به insight سریع نیاز دارند، اما انتقال بی‌ضابطهٔ دادهٔ خام ریسک ایجاد می‌کند.</li>
                <li class="list-item">DataSense Alpha مسیر <strong style="font-family: 'JetBrains Mono', monospace; color: #0F172A;" dir="ltr">Explore → Validate → Deliver</strong> را روی دستگاه کاربر نگه می‌دارد.</li>
                <li class="list-item">هدف Alpha، اثبات یک تجربهٔ desktop قابل‌اعتماد پیش از گسترش محصول است.</li>
            </ul>
        </div>
        
        <div class="side-graphic">
            <div class="bracket-container"></div>
        </div>
    </div>
</body>
</html>
